# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/DimmedMonokai.conf
#include ./kitty-themes/MaterialDark.conf
#include ./kitty-themes/FrontEndDelight.conf
#include ./kitty-themes/Dracula.conf
#include ./kitty-themes/Monokai_Soda.conf
#include ./kitty-themes/Twilight.conf
#include ./kitty-themes/Duotone_Dark.conf

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 16.0

background_opacity 0.8
dynamic_background_opacity 1
confirm_os_window_close 0
background_blur 2

# Animated cursor
cursor_trail 1
cursor_shape block
# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

#foreground #dddddd
#background #000000
#cursor #dddddd
