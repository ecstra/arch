general {
    grace = 0
    hide_cursor = true
    disable_loading_bar = true
    no_fade_in = true
}

background {
    monitor =
    path = /home/ecstra/.wallpapers/wallpaper_100.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.9)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 140
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(255, 255, 255, 0.75)
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    position = 0, 50
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span alpha="50%"><i>Enter Password...</i></span>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
}

# USER ICON & NAME
label {
    monitor =
    text =   $USER
    color = rgba(255, 255, 255, 0.6)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}
